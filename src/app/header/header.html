<header>
  <div class="logo">
    <a routerLink="/">♾️ SkillPass</a>
  </div>

  <nav>
    <!-- Si NON authentifié -->
    <ng-container *ngIf="!authService.isAuthenticated()">
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
      <a routerLink="/register" routerLinkActive="active">Inscription</a>
    </ng-container>

    <!-- Si authentifié USER -->
    <ng-container *ngIf="authService.isAuthenticated()">
      <a routerLink="/tests" routerLinkActive="active">Tests</a>
      <a routerLink="/profile" routerLinkActive="active">Profil</a>

      <!-- Admin uniquement -->
      <ng-container *ngIf="authService.isAdmin()">
        <a routerLink="/admin" routerLinkActive="active">Dashboard</a>
        <a routerLink="/questions" routerLinkActive="active">Questions</a>
        <a routerLink="/tests/admin" routerLinkActive="active">Gestion tests</a>
      </ng-container>

      <a class="btn-logout" href="#" (click)="$event.preventDefault(); logout()">Déconnexion</a>
    </ng-container>
  </nav>
</header>
