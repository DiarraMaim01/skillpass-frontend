<div class="result-container">
  <div class="result-card">

    <div class="mention">{{ mention }}</div>

    <div class="score-circle" [style.border-color]="scoreColor">
      <span class="score-value" [style.color]="scoreColor">{{ pourcentage }}%</span>
      <span class="score-label">Score</span>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Points</span>
        <span class="stat-value">{{ score }} / {{ totalPoints }}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Questions</span>
        <span class="stat-value">{{ totalQuestions }}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Temps</span>
        <span class="stat-value">{{ tempsFormate }}</span>
      </div>
    </div>

    <div class="actions">
      <button routerLink="/tests" class="btn-secondary">← Retour aux tests</button>
      <button [routerLink]="['/tests', testId, 'play']" class="btn-primary"> Recommencer</button>
      <button *ngIf="pourcentage >= 60" (click)="downloadCertif()" class="btn-certif">🎓 Télécharger le certificat</button>

    </div>

  </div>
</div>
